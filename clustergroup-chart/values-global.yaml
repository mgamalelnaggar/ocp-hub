global:
  singleArgoCD: false
  extraValueFiles: []
  pattern: hub
  localClusterDomain: <tbd>
  hubClusterDomain: <tbd>
  vpArgoNamespace: openshift-gitops
  secretLoader:
    disabled: true
  secretStore:
    backend: "kubernetes"
  targetRevision: main
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic
    applicationRetryLimit: 20
main:
  clusterGroupName: hub
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"
