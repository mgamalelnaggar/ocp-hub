global:
  singleArgoCD: false
  repoURL: https://github.com/mgamalelnaggar/ocp-hub.git
  pattern: hub
  localClusterDomain: cluster-g65b2.dyn.redhatworkshops.io
  hubClusterDomain: cluster-g65b2.dyn.redhatworkshops.io
  vpArgoNamespace: openshift-gitops
  secretLoader:
    disabled: True
  secretStore:
    backend: "kubernetes"
  targetRevision: main
  options:
    useCSV: True
    syncPolicy: Automatic
    installPlanApproval: Automatic
    autoApproveManualInstallPlans: false
    applicationRetryLimit: 20


