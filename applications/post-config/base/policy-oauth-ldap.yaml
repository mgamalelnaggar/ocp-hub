apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-oauth-ldap
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
    policy.open-cluster-management.io/standards: NIST SP 800-53
spec:
  disabled: true
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: config-oauth-ldap
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                    - name: ldapidp
                      mappingMethod: claim
                      type: LDAP
                      ldap:
                        attributes:
                          id:
                            - dn
                          email:
                            - mail
                          name:
                            - cn
                          preferredUsername:
                            - sAMAccountName
                        bindDN: "CN=hub-tag,OU=Service Accounts,DC=internal,DC=eg,DC=vodafone,DC=com"
                        bindPassword:
                          name: ldap-secret
                        ca:
                          name: ca-config-map
                        insecure: false
                        url: " ldaps://HQ.internal.eg.vodafone.com:636/DC=internal,DC=eg,DC=vodafone,DC=com?sAMAccountName?scope?filter"
