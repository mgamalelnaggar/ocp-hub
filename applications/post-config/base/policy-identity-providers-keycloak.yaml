apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-identity-providers-keycloak
  namespace: open-cluster-management-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: configure-identity-providers-w-keycloak
        spec:
          remediationAction: enforce
          severity: high
          object-templates: 
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                  annotations:
                    release.openshift.io/create-only: "true"
                    include.release.openshift.io/self-managed-high-availability: "true"
                spec:
                  identityProviders:  
                    - name: keycloak
                      mappingMethod: claim
                      type: OpenID
                      openID:
                        claims:
                          email:
                          - email
                          name:
                          - name
                          preferredUsername:
                          - preferred_username
                        clientID: '{{hub fromConfigMap "ztp-core-policy" "core-data" (printf "%s-rhbk-client-id" .ManagedClusterName) hub}}'
                        clientSecret:
                          name: keycloak-client-secret
                        issuer: https://sso.apps.cluster-7xvp8.dyn.redhatworkshops.io/realms/sso
