apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-htpasswd-idp
  namespace: open-cluster-management-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: config-htpasswd-idp
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: htpasswd-secret
                  namespace: openshift-config
                type: Opaque
                data:
                  # Replace with your base64 encoded htpasswd file content (e.g., echo -n 'user:$2y$05$...' | base64)
                  htpasswd: ocpadmin:$2y$05$FBfqiku6OycNE9iiA8Xf.eRkWJHzZWUXVPIfZW0eoRyJcJScuHzS.
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                    - name: htpasswd-provider
                      mappingMethod: claim
                      type: HTPasswd
                      htpasswd:
                        fileData:
                          name: htpasswd-secret
