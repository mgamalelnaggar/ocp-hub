apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: nfs-info-cm
    namespace: ocp-etcd-backup
    options:
      disableNameSuffixHash: true
    literals:
      - nfs_ip=192.168.20.100
      - nfs_path=/mnt/backups/ocp/
  - name: ldap-config
    namespace: default
    options:
      disableNameSuffixHash: true
    literals:
      - ldap=enabled
      - bindDN=""
      - bindpassword=
      - secure=true
      - ldap-ca=|
      - url=ldap/ldaps://<>
