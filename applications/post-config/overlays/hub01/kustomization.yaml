apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: nfs-info-cm
    namespace: ocp-etcd-backup
    options:
      disableNameSuffixHash: true
    literals:
      - nfs_ip=192.168.20.100
      - nfs_path=/mnt/backups/ocp/
