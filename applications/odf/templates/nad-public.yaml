apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: odf-public
  namespace: {{ .Values.odf.namespace }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "macvlan",
    "master": {{ .Values.odf.network.odfpublic.master }},
    "mode": "bridge",
    "ipam": {
      "type": "whereabouts",
      "range": {{ .Values.odf.network.odfpublic.ipam.range }},
      "exclude": {{ .Values.odf.network.odfpublic.ipam.exclude }}
    }
  }'
