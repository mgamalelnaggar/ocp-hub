---
apiVersion: v1
kind: ConfigMap
metadata:
  name: extract-loki-credentials-script
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "9"
data:
  extract-and-create.sh: |
    #!/usr/bin/env bash
    set -eo pipefail

    NAMESPACE="openshift-logging"
    SRC_NAME={{ index .Values.loki."s3-bucket-name" }}
    TARGET_SECRET_NAME={{ index .Values.loki."s3-secret-name" }}

    # 1. Check if the target secret already exists
    if oc get secret "${TARGET_SECRET_NAME}" -n "${NAMESPACE}" &>/dev/null; then
      echo "Secret '${TARGET_SECRET_NAME}' already exists in namespace '${NAMESPACE}'. Skipping creation."
      exit 0
    fi

    echo "Secret '${TARGET_SECRET_NAME}' not found. Extracting credentials from ${SRC_NAME}..."

    # 2. Extract base64-encoded credentials from Secret
    ACCESS_KEY_ID=$(oc get secret "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
    ACCESS_KEY_SECRET=$(oc get secret "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)

    # 3. Extract plain-text bucket details from ConfigMap
    BUCKET_NAME=$(oc get configmap "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_NAME}')
    BUCKET_HOST=$(oc get configmap "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_HOST}')
    BUCKET_PORT=$(oc get configmap "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_PORT}')

    if [[ -z "$ACCESS_KEY_ID" || -z "$ACCESS_KEY_SECRET" || -z "$BUCKET_NAME" || -z "$BUCKET_HOST" || -z "$BUCKET_PORT" ]]; then
      echo "Error: Required fields could not be extracted from ${SRC_NAME}."
      exit 1
    fi

    ENDPOINT="https://${BUCKET_HOST}:${BUCKET_PORT}"

    echo "Creating secret ${TARGET_SECRET_NAME} in namespace ${NAMESPACE}..."

    # 4. Create target Secret directly
    oc create secret generic "${TARGET_SECRET_NAME}" \
      --namespace="${NAMESPACE}" \
      --from-literal=access_key_id="${ACCESS_KEY_ID}" \
      --from-literal=access_key_secret="${ACCESS_KEY_SECRET}" \
      --from-literal=bucketnames="${BUCKET_NAME}" \
      --from-literal=endpoint="${ENDPOINT}"

    echo "Secret '${TARGET_SECRET_NAME}' created successfully."

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-loki-s3-secret-job
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: loki-sa
      restartPolicy: OnFailure
      automountServiceAccountToken: true
      containers:
        - name: loki-secret-executor
          image: {{ .Values.loki.jobimage | default $.Values.clusterGroup.imperative.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /scripts/extract-and-create.sh
          volumeMounts:
            - name: script-volume
              mountPath: /scripts
      volumes:
        - name: script-volume
          configMap:
            name: extract-loki-credentials-script
            defaultMode: 0755
