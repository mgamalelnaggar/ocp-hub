apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki 
  namespace: openshift-logging
spec:
  limits:
    global:
      retention:
        days: 10
    tenants:
      application:
        retention:
          days: 3
      audit:
        retention:
          days: 7
      infrastructure:
        retention:
          days: 7
  size: 1x.medium 
  storage:
    schemas:
      - effectiveDate: '2023-10-15'
        version: v13
    secret:
      name: logging-loki-odf 
      type: s3
    tls:
      caName: openshift-service-ca.crt
  storageClassName: infra
  template: {}
  tenants:
    mode: openshift-logging
