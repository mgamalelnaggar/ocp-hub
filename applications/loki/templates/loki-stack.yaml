apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki 
  namespace: openshift-logging
spec:
  limits:
    global:
      retention:
        days: 10
    tenants:
      application:
        retention:
          days: 3
      audit:
        retention:
          days: 7
      infrastructure:
        retention:
          days: 7
  size: {{ $.Values.loki.size }} 
  storage:
    schemas:
      - effectiveDate: '2023-10-15'
        version: v13
    secret:
      name: {{ index .Values.loki."s3-secret-name" }}
      type: s3
    tls:
      caName: openshift-service-ca.crt
  storageClassName: {{ index .Values.loki."storage-class-name" }}
  template: {}
  tenants:
    mode: openshift-logging
