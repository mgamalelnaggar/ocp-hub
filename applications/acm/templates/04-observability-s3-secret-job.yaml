{{- if .Values.acm.observability.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: extract-acm-observ-credentials-script
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "8"
data:
  extract-and-create.sh: |
    #!/usr/bin/env bash
    set -eo pipefail

    NAMESPACE="open-cluster-management-observability"
    SRC_NAME="rhacm-observability-bucket-odf"
    TARGET_SECRET_NAME="thanos-object-storage"
      
    # 1. Check if the target secret already exists
    if oc get secret "${TARGET_SECRET_NAME}" -n "${NAMESPACE}" &>/dev/null; then
      echo "Secret '${TARGET_SECRET_NAME}' already exists in namespace '${NAMESPACE}'. Skipping creation."
      exit 0
    fi

    echo "Secret '${TARGET_SECRET_NAME}' not found. Extracting credentials from ${SRC_NAME}..."

    # 2. Extract base64-encoded credentials from Secret
    ACCESS_KEY_ID=$(oc get secret "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
    ACCESS_KEY_SECRET=$(oc get secret "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)

    # 3. Extract plain-text bucket details from ConfigMap
    BUCKET_NAME=$(oc get configmap "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_NAME}')
    BUCKET_HOST=$(oc get configmap "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_HOST}')
    BUCKET_PORT=$(oc get configmap "${SRC_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.BUCKET_PORT}')

    if [[ -z "$ACCESS_KEY_ID" || -z "$ACCESS_KEY_SECRET" || -z "$BUCKET_NAME" || -z "$BUCKET_HOST" || -z "$BUCKET_PORT" ]]; then
      echo "Error: Required fields could not be extracted from ${SRC_NAME}."
      exit 1
    fi

    ENDPOINT="${BUCKET_HOST}:${BUCKET_PORT}"
    echo "Creating secret ${TARGET_SECRET_NAME} in namespace ${NAMESPACE}..."

    # 4. Create target Secret directly
    TMP_FILE=$(mktemp)
    cat <<EOF > "${TMP_FILE}"
    type: s3
    config:
      bucket: "${BUCKET_NAME}"
      endpoint: "${ENDPOINT}"
      insecure: false
      http_config:
        insecure_skip_verify: true
      access_key: "${ACCESS_KEY_ID}"
      secret_key: "${ACCESS_KEY_SECRET}"
    EOF

    oc create secret generic "${TARGET_SECRET_NAME}" -n "${NAMESPACE}" --from-file=thanos.yaml="${TMP_FILE}"
    rm -f "${TMP_FILE}"
    echo "Secret '${TARGET_SECRET_NAME}' created successfully."

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-acm-observ-s3-secret-job
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  template:
    spec:
      serviceAccountName: thanos-tmp-sa
      restartPolicy: OnFailure
      automountServiceAccountToken: true
      containers:
        - name: thanos-secret-executor
          image: {{ .Values.acm.observability.jobimage | default "quay.io/validatedpatterns/imperative-container:v1" | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /scripts/extract-and-create.sh
          volumeMounts:
            - name: script-volume
              mountPath: /scripts
      volumes:
        - name: script-volume
          configMap:
            name: extract-acm-observ-credentials-script
            defaultMode: 0755
{{- end }}
