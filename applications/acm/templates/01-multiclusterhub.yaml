apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- if .Values.acm.disconnected }}
    installer.open-cluster-management.io/mce-subscription-spec: '{"source": "{{ .Values.acm.catalogsource | default "redhat-operators-disconnected" }}", "installPlanApproval": "Automatic"}'
    installer.open-cluster-management.io/oadp-subscription-spec: '{"source": "{{ .Values.acm.catalogsource | default "redhat-operators-disconnected" }}", "installPlanApproval": "Automatic"}'
    {{- end }}
spec:
  availabilityConfig: High
  localClusterName: local-cluster
  overrides:
    components:
      - configOverrides: {}
        enabled: true
        name: app-lifecycle
      - configOverrides: {}
        enabled: true
        name: cluster-lifecycle
      - configOverrides: {}
        enabled: true
        name: console
      - configOverrides: {}
        enabled: true
        name: grc
      - configOverrides: {}
        enabled: true
        name: insights
      - configOverrides: {}
        enabled: true
        name: multicluster-engine
      - configOverrides: {}
        enabled: {{ .Values.acm.observability.enabled | default false }}
        name: multicluster-observability
      - configOverrides: {}
        enabled: true
        name: search
      - configOverrides: {}
        enabled: true
        name: submariner-addon
      - configOverrides: {}
        enabled: true
        name: volsync
      - configOverrides: {}
        enabled: false
        name: cluster-backup
      - configOverrides: {}
        enabled: false
        name: fine-grained-rbac
      - configOverrides: {}
        enabled: true
        name: siteconfig
      - configOverrides: {}
        enabled: false
        name: cnv-mtv-integrations  
      - configOverrides: {}	
        enabled: true	
        name: cluster-permission
