quay:
  namespace: quay-enterprise
  configBundleSecret:
    deploy: true
    name: quay-init-config-bundle-secret
  setup:
    admin:
      name: quayadmin
      email: quayadmin@example.com
    user:
      name: developer1
      email: developer1@myorg.com
  storage:
    postgres:
      size: 50Gi # Default and minimum size is 50 Gi
    clairpostgres:
      size: 50Gi # Default and minimum size is 50 Gi

job:
  #image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.20
  image: quay.io/validatedpatterns/imperative-container:v1
  
quay_config: {}

# Object Storage configuration - using NooBaa MCG
objectStorage:
  objectBucketClaim:
    name: quay-bucket
    bucketName: quay-datastore
    storageClass: openshift-storage.noobaa.io
