kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: db-claim-pvc
  namespace: {{ .Values.keycloak.namespace }}
spec:
  accessModes:
    - ReadWriteOnce 
  resources:
    requests:
      storage: 10Gi 
  storageClassName: ocs-storagecluster-ceph-rbd
