apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-db
  namespace: {{ .Values.keycloak.namespace }}
spec:
  serviceName: postgresql-db-service
  selector:
    matchLabels:
      app: postgresql-db
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql-db
    spec:
      containers:
        - name: postgresql-db
          image: registry.redhat.io/rhel9/postgresql-16:latest
          volumeMounts:
            - mountPath: /var/lib/pgsql/data
              name: db-claim
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password
            - name: POSTGRESQL_DATABASE
              value: keycloak
            - name: PGDATA
              value: /var/lib/pgsql/data
          ports:
            - containerPort: 5432
      volumes:
        - name: db-claim
          persistentVolumeClaim:
            claimName: db-claim-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: {{ .Values.keycloak.namespace }}
spec:
  selector:
    app: postgresql-db
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
