kind: Route
apiVersion: route.openshift.io/v1
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: keycloak
  namespace: keycloak
spec:
  host: sso-{{ .Values.clusterGroup.name }}.{{ .Values.global.hubClusterDomain }}
  to:
    kind: Service
    name: keycloak
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
