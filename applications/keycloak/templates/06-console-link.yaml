apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  name: keycloak-link
  namespace: keycloak
spec:
  applicationMenu:
    section: Red Hat applications
    #imageURL: 'https://sso.{{ .Values.global.hubClusterDomain }}/resources/welcome/keycloak/img/keycloak-logo.svg'
    imageURL: 'https://sso.{{ .Values.global.hubClusterDomain }}/resources/*/admin/keycloak.v2/icon.svg'
  href: 'https://sso.{{ .Values.global.hubClusterDomain }}'
  location: ApplicationMenu
  text: 'Red Hat Build of Keycloak'
