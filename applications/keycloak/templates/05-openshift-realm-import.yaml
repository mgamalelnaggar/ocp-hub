apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  name: sso
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm:
    enabled: true
    duplicateEmailsAllowed: false
    clients:
      - enabled: true
        clientAuthenticatorType: client-secret
        redirectUris:
          - "https://oauth-openshift.{{ .Values.global.hubClusterDomain }}/oauth2callback/sso"
          - "https://console-openshift-console.{{ .Values.global.hubClusterDomain }}"
          - "https://console-openshift-console.{{ .Values.global.hubClusterDomain }}/*"
        frontchannelLogout: false
        serviceAccountsEnabled: true
        clientId: idp-4-ocp
        secret: BPaQhhtGkINlw19i
        publicClient: false
        standardFlowEnabled: true
        protocol: openid-connect
        directAccessGrantsEnabled: true
    users:
      - credentials:
          - temporary: true
            type: password
            value: redhat@123
        email: admin@domain.com
        emailVerified: true
        enabled: true
        firstName: Admin
        realmRoles:
          - admin
        username: admin
    sslRequired: external
    realm: sso
    registrationAllowed: false
    groups:
      - name: admins
      - name: users
    id: sso
    loginWithEmailAllowed: true
    roles:
      realm:
        - description: Administrator role
          name: admin
