---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-keycloak-import-job
  namespace: keycloak
  annotations:
     argocd.argoproj.io/hook: PostSync
     argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: keycloak-import-job
          image: registry.redhat.io/openshift4/ose-tools-rhel9:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              csv="$(oc get subscriptions.operators.coreos.com rhbk-operator -n keycloak -o jsonpath='{ .status.installedCSV }')"
              image="$(oc get csv ${csv} -n keycloak -o json | jq -r '.spec.relatedImages[]| select(.name == "keycloak")| .image')"
              oc delete job -n keycloak keycloak-import-job
              cat << EOF | oc create -n keycloak -f - >&2 
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: keycloak-import-job
                namespace: keycloak
              spec:
                backoffLimit: 6
                completionMode: NonIndexed
                completions: 1
                manualSelector: false
                parallelism: 1
                podReplacementPolicy: TerminatingOrFailed
                suspend: false
                template:
                  spec:
                    containers:
                  spec:
                    containers:
                    - args:
                      - -Djgroups.dns.query=caas-foundation-keycloak-discovery.keycloak
                      - --verbose
                      - import
                      - --file
                      - /import/keycloak.json
                      name: import-config
                      env:
                      - name: KC_DB
                        value: postgres
                      - name: KC_DB_USERNAME
                        valueFrom:
                          secretKeyRef:
                            key: username
                            name: keycloak-db-secret
                      - name: KC_DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            key: password
                            name: keycloak-db-secret
                      - name: KC_DB_URL_HOST
                        value: postgres-db
                      image: ${image}
                      imagePullPolicy: Always
                      resources:
                        limits:
                          memory: 2Gi
                        requests:
                          memory: 1700Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop:
                          - ALL
                        runAsNonRoot: true
                      terminationMessagePath: /dev/termination-log
                      terminationMessagePolicy: File
                      volumeMounts:
                      - mountPath: /import/
                        name: import-secret
                    dnsPolicy: ClusterFirst
                    enableServiceLinks: true
                    preemptionPolicy: PreemptLowerPriority
                    priority: 0
                    restartPolicy: Never
                    schedulerName: default-scheduler
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    serviceAccount: default
                    serviceAccountName: default
                    terminationGracePeriodSeconds: 30
                    volumes:
                    - name: import-secret
                      secret:
                        defaultMode: 420
                        optional: false
                        secretName: keycloak-config-secret
              EOF

              oc wait -n keycloak --timeout=300s --for=condition=Complete jobs/keycloak-import-job 
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      serviceAccount: kc-job-sa
      serviceAccountName: kc-job-sa
      terminationGracePeriodSeconds: 30
